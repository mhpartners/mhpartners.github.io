<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 44" fill="none" width="195" height="44">
  <defs>
    <linearGradient id="vtx-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="vtx-shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E232E" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </linearGradient>
    <filter id="vtx-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Left Icon Emblem -->
  <g filter="url(#vtx-glow)">
    <!-- Outer Gradient Border -->
    <rect x="2" y="2" width="40" height="40" rx="12" fill="url(#vtx-grad)" />
    <!-- Inner Dark Core -->
    <rect x="3.5" y="3.5" width="37" height="37" rx="10.5" fill="url(#vtx-shield)" />
    <!-- Geometric Apex 'V' Mark -->
    <path d="M12 12 L22 32 L32 12 L27.5 12 L22 23.5 L16.5 12 Z" fill="url(#vtx-grad)" />
    <circle cx="22" cy="15" r="2" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <!-- Main Title -->
  <text x="54" y="23" font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" letter-spacing="-0.02em">
    VERTEX APPS
  </text>

  <!-- Subtitle -->
  <text x="54" y="36" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="10" fill="#94A3B8" letter-spacing="0.01em">
    Native Android Atelier
  </text>
</svg>
